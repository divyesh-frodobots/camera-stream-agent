<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Agora local viewer</title>
    <style>
      :root {
        color-scheme: dark;
        font-family: system-ui, sans-serif;
      }
      body {
        margin: 0;
        background: #111;
        color: #eee;
      }
      header {
        display: flex;
        flex-wrap: wrap;
        gap: 0.75rem;
        align-items: center;
        padding: 0.75rem 1rem;
        background: #1c1c1c;
      }
      #player {
        width: 100%;
        min-height: 70vh;
        background: #000;
      }
      #status {
        flex: 1;
        min-width: 12rem;
      }
      button {
        padding: 0.4rem 0.8rem;
        cursor: pointer;
      }
      .err {
        color: #ff8a8a;
      }
    </style>
  </head>
  <body>
    <header>
      <div id="status">loading session?</div>
      <button type="button" id="join">Join</button>
      <button type="button" id="leave">Leave</button>
    </header>
    <div id="player"></div>
    <script src="/agora-rtc-sdk.js"></script>
    <script>
      const statusEl = document.getElementById('status');
      const joinBtn = document.getElementById('join');
      const leaveBtn = document.getElementById('leave');

      let client = null;
      let waitTimer = null;
      let sawRemote = false;

      function setStatus(text, isError) {
        statusEl.textContent = text;
        statusEl.className = isError ? 'err' : '';
      }

      async function loadSession() {
        const res = await fetch('/session');
        const body = await res.json().catch(() => ({}));
        if (!res.ok) {
          throw new Error(body.message || 'Run npm run pull-local-config first');
        }
        return body;
      }

      async function leave() {
        if (waitTimer) {
          clearTimeout(waitTimer);
          waitTimer = null;
        }
        sawRemote = false;
        if (client) {
          await client.leave();
          client = null;
        }
        document.getElementById('player').innerHTML = '';
        setStatus('left');
      }

      async function join() {
        if (typeof AgoraRTC === 'undefined') {
          throw new Error(
            'Agora Web SDK did not load. Run npm install in windows-camera-agent, then restart npm run viewer.',
          );
        }
        await leave();
        setStatus('connecting');
        const session = await loadSession();
        const expiry = session.expiresAt ? new Date(session.expiresAt).toLocaleString() : '';
        setStatus('connecting to ' + session.channel + (expiry ? ' (token until ' + expiry + ')' : ''));

        client = AgoraRTC.createClient({ mode: 'live', codec: 'h264' });
        await client.setClientRole('audience');

        client.on('user-published', async (user, mediaType) => {
          await client.subscribe(user, mediaType);
          if (mediaType === 'video') {
            sawRemote = true;
            user.videoTrack.play('player');
            setStatus('live ? ' + session.channel + (expiry ? ' ? token until ' + expiry : ''));
          }
          if (mediaType === 'audio' && user.audioTrack) {
            user.audioTrack.play();
          }
        });

        client.on('user-unpublished', () => {
          sawRemote = false;
          setStatus('waiting for camera ? ' + session.channel);
        });

        try {
          await client.join(session.appId, session.channel, session.token, session.uid);
        } catch (err) {
          setStatus('Agora join failed: ' + (err && err.message ? err.message : err), true);
          return;
        }

        setStatus('waiting for camera ? ' + session.channel + (expiry ? ' ? token until ' + expiry : ''));
        waitTimer = setTimeout(() => {
          if (!sawRemote) {
            setStatus(
              'No remote video after 15s. Agent may not be publishing. Check STREAM_URL / FFmpeg logs.',
              true,
            );
          }
        }, 15000);
      }

      joinBtn.addEventListener('click', () => join().catch((err) => setStatus(String(err.message || err), true)));
      leaveBtn.addEventListener('click', () => leave().catch((err) => setStatus(String(err.message || err), true)));
      join().catch((err) => setStatus(String(err.message || err), true));
    </script>
  </body>
</html>
